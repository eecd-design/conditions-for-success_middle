description: >
  This short course serves two audiences. It opens with an introduction for all
  middle level educators on the purpose and structure of the Conditions for
  Success Developmental Continuums, including how they support self-assessment
  and progress planning. It is then followed by three modules designed
  specifically for facilitators of the framework.
