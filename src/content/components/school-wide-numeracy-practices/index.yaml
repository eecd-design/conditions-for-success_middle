indicator: high-yield-instructional-practices
tag: '6.3'
title: School-wide Numeracy Practices
initiating:
  considerations:
    - tag: 6.3.1
      title: >-
        Educators recognize that learners may need support to understand
        quantities, patterns, data, and relationships in all subjects. They
        begin drawing attention to the meaning behind the numbers, information,
        or processes being used.
      compass: false
      categories: []
    - tag: 6.3.2
      title: >-
        Educators identify where learners use numbers and mathematical ideas
        within their subjects. Examples may include estimating, measuring,
        comparing, calculating, sequencing, or noticing patterns.
      compass: false
      categories: []
    - tag: 6.3.3
      title: >-
        Educators begin using visuals, models, tables, graphs, diagrams, or
        other tools to help learners understand information.
      compass: false
      categories: []
    - tag: 6.3.4
      title: >-
        Learners are beginning to encounter tasks where they can consider more
        than one approach, make choices, and explain how they reached an answer
        or decision.
      compass: false
      categories: []
    - tag: 6.3.5
      title: >-
        Educators begin creating opportunities for learners to explain how they
        interpreted information, selected a strategy, or reached a conclusion.
      compass: false
      categories: []
    - tag: 6.3.6
      title: >-
        Assessment often focuses on the final answer or completed product.
        Educators begin noticing the strategies, reasoning, and understanding
        learners demonstrate along the way.
      compass: false
      categories: []
    - tag: 6.3.7
      title: >-
        Learners often rely on educator guidance to choose strategies, complete
        tasks, and/or decide whether their answers or conclusions make sense.
      compass: false
      categories: []
implementing:
  considerations:
    - tag: 6.3.8
      title: >-
        Educators connect mathematical ideas to prior learning, familiar
        experiences, and the subject being studied—for example, interpreting a
        timeline, comparing scientific data, or examining proportion in art.
      compass: false
      categories: []
    - tag: 6.3.9
      title: >-
        Educators intentionally provide opportunities for learners to use
        relevant mathematical knowledge and language in meaningful tasks, such
        as measuring, estimating, comparing data, identifying patterns, or
        explaining change.
      compass: false
      categories: []
    - tag: 6.3.10
      title: >-
        Educators model different ways of organizing, representing, and working
        with mathematical information such as words, numbers, tables, graphs,
        diagrams, or models.
      compass: false
      categories: []
    - tag: 6.3.11
      title: >-
        Educators provide meaningful problems with different entry points and
        possible approaches. They model how to plan, work through challenges,
        and check whether a solution makes sense.
      compass: false
      categories: []
    - tag: 6.3.12
      title: >-
        Educators model useful language, questions, and explanations and provide
        structured opportunities for learners to share their thinking.
      compass: false
      categories: []
    - tag: 6.3.13
      title: >-
        Educators use observation, questioning, discussion, and feedback to
        understand how learners are thinking and where they may need support.
      compass: false
      categories: []
    - tag: 6.3.14
      title: >-
        With guidance, learners begin using familiar numeracy strategies in
        different subjects and meaningful situations—for example, reading a
        graph, estimating a measurement, or comparing numerical information.
      compass: false
      categories: []
developing:
  considerations:
    - tag: 6.3.15
      title: >-
        Learners explain connections between mathematical ideas and the context
        in which they are being used. They use what they already know to make
        sense of increasingly complex information.
      compass: false
      categories: []
    - tag: 6.3.16
      title: >-
        Learners select and apply appropriate mathematical knowledge to
        interpret information, solve problems, and make decisions, such as
        comparing options, analyzing data, calculating change, or estimating
        outcomes.
      compass: false
      categories: []
    - tag: 6.3.17
      title: >-
        Learners select useful strategies and representations to organize
        information and communicate their understanding, such as using a table,
        graph, diagram, model, or written explanation.
      compass: false
      categories: []
    - tag: 6.3.18
      title: >-
        Learners use different strategies, explain their decisions, check
        whether their solutions make sense, and learn from mistakes.
      compass: true
      categories: []
sustaining:
  considerations:
    - tag: 6.3.13
      title: >-
        Educators consistently collaborate to connect concepts and skills across
        subject areas and regularly check for readiness with learners. Learners
        can articulate and set their own goals and connect them to a variety of
        contexts. For example, learners identify math goals while designing a
        travel brochure in French (distance, budget, time).
      compass: false
      categories: []
    - tag: 6.3.14
      title: >-
        Educators design tasks that promote reasoning, enable more complex
        problem solving, and allow varied solution strategies. Learners have a
        growth mindset and use self-reflection and critical thinking skills to
        complete tasks and value mistakes. For example, learners compare news
        articles with conflicting statistics, evaluate credibility, and discuss
        how numbers influence readers. They justify conclusions with evidence
        and refine their analysis through peer feedback.
      compass: false
      categories: []
    - tag: 6.3.15
      title: >-
        Learner-led discussions are monitored, with learners explaining or
        challenging the processes and reasoning used. Learners independently
        generate probing analytical questions and use a variety of mathematical
        representations to defend their reasoning. For example, learners debate
        which experimental setup gives the most reliable data, using charts and
        trendlines to defend their position.
      compass: false
      categories: []
    - tag: 6.3.16
      title: >-
        Educators use evidence gathered from a variety of sources during
        instruction to adjust pace and tasks. Feedback is timely, descriptive,
        and specific and encourages reflection. Learners independently set goals
        and use metacognitive strategies to reflect on and monitor their
        progress. For example, after presenting data visualizations, learners
        reflect on how effectively their graph communicated a message and set
        goals for clarity for next time.
      compass: false
      categories: []
