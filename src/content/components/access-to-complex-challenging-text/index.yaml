indicator: access-and-equity
tag: '2.7'
title: Access to Complex, Challenging Text
initiating:
  considerations:
    - tag: 2.7.1
      title: >-
        Instruction is primarily remedial, focusing on below-grade-level texts
        and isolated skills.
      compass: false
      categories: []
    - tag: 2.7.2
      title: >-
        Learners have limited opportunities to engage with grade-level, complex
        texts.
      compass: false
      categories: []
    - tag: 2.7.3
      title: >-
        Texts are limited to traditional print materials, with little
        recognition of an expanded definition of text (e.g., multimodal texts,
        digital media, spoken word, infographics, visual narratives).
      compass: false
      categories: []
    - tag: 2.7.4
      title: >-
        Reading tasks and supports focus mainly on addressing gaps, with limited
        emphasis on independence, confidence, or learner choice.
      compass: false
      categories: []
implementing:
  considerations:
    - tag: 2.7.5
      title: >-
        Instruction begins incorporating grade-level texts with some
        scaffolding, although reliance on below-grade-level materials may
        remain.
      compass: false
      categories: []
    - tag: 2.7.6
      title: >-
        Expanded definition of text begins to emerge, with educators introducing
        multimodal texts (e.g., podcasts, digital articles, visual storytelling,
        graphic novels) to engage learners, though traditional print-based
        materials still dominate.
      compass: false
      categories: []
    - tag: 2.7.7
      title: >-
        Educators experiment with scaffolds, digital tools, and assistive
        technologies (e.g., text-to-speech, audiobooks, screen readers,
        annotation apps) to help learners access and engage with complex texts.
      compass: false
      categories: []
    - tag: 2.7.8
      title: >-
        Discussions about acceleration and learner independence begin, though
        remediation mindsets and practices may still persist.
      compass: false
      categories: []
developing:
  considerations:
    - tag: 2.7.9
      title: >-
        Many learners read grade-level texts with structured scaffolds (e.g.,
        frontloading vocabulary, mixed ability groupings, guided annotation,
        modeling complex comprehension strategies).
      compass: true
      categories: []
    - tag: 2.7.10
      title: >-
        An expanded definition of text is embedded, and learners engage with a
        variety of text types (e.g., documentary clips, professional writing,
        social media discourse, primary source visuals) to support comprehension
        of grade-level material.
      compass: false
      categories: []
    - tag: 2.7.11
      title: >-
        Educators routinely analyze learner work and progress data to adjust
        scaffolds rather than lower text complexity.
      compass: false
      categories: []
    - tag: 2.7.12
      title: >-
        Assessment practices enable learners to demonstrate understanding
        through various formats, such as learner-created videos, visual
        annotations, and audio responses.
      compass: false
      categories: []
sustaining:
  considerations:
    - tag: 2.7.13
      title: >-
        Grade-level, culturally-responsive texts are the norm, with intentional
        scaffolds ensuring all learners engage meaningfully.
      compass: false
      categories: []
    - tag: 2.7.14
      title: >-
        An expanded definition of text is fully normalized, with learners
        choosing from diverse text formats based on purpose, audience, and
        accessibility needs.
      compass: false
      categories: []
    - tag: 2.7.15
      title: >-
        Educators use disciplinary literacy strategies, teaching learners how to
        navigate complex texts in different learning areas.
      compass: false
      categories: []
    - tag: 2.7.16
      title: >-
        Learners use a range of technologies (e.g., adaptive reading tools,
        digital collaboration platforms, interactive media) to independently
        make choices, set goals, and reflect on their use of strategies and
        supports to access, analyze, and create complex texts that advance their
        reading success.
      compass: false
      categories: []
