indicator: high-yield-instructional-practices
tag: '6.2'
title: School-wide Literacy Practices
initiating:
  considerations:
    - tag: 6.2.1
      title: >-
        Educators recognize that learners need support in understanding texts
        and making meaning from content across learning areas. Reading tasks
        often focus on locating information and recalling ideas.
      compass: false
      categories: []
    - tag: 6.2.2
      title: >-
        Educators identify vocabulary demands and occasionally provide supports
        when learners encounter unfamiliar terms or concepts.
      compass: false
      categories: []
    - tag: 6.2.3
      title: >-
        Educators occasionally provide graphic organizers, guiding questions,
        note-taking supports, or reading tools, but use is inconsistent across
        classrooms.
      compass: false
      categories: []
    - tag: 6.2.4
      title: >-
        Discussion is primarily educator-directed, and learners have limited
        opportunities to explain thinking, ask questions, or build on the ideas
        of others.
      compass: false
      categories: []
    - tag: 6.2.5
      title: >-
        Learners use writing mainly to record information or complete assigned
        tasks. They have limited opportunities to engage in planning, revision,
        the feedback cycle, and/or reflection as part of the writing process.
      compass: false
      categories: []
    - tag: 6.2.6
      title: >-
        Assessment is primarily summative, with limited opportunities for
        learners to use feedback to improve learning.
      compass: false
      categories: []
    - tag: 6.2.7
      title: >-
        Learners rely heavily on educator support to access texts, participate
        in discussions, and communicate understanding.
      compass: false
      categories: []
implementing:
  considerations:
    - tag: 6.2.8
      title: >-
        Educators intentionally support comprehension before, during, and after
        reading by activating prior knowledge, establishing a purpose for
        reading, and modelling high-yield comprehension strategies.
      compass: false
      categories: []
    - tag: 6.2.9
      title: >-
        Educators intentionally build background knowledge and teach important
        vocabulary in context before learning begins.
      compass: false
      categories: []
    - tag: 6.2.10
      title: >-
        Educators model and provide opportunities to use high-yield literacy
        tools and strategies such as predicting, questioning, clarifying,
        visualizing, summarizing, "Know, Want to Know, Learned" (KWL),
        anticipation guides, note-taking, and graphic organizers.
      compass: false
      categories: []
    - tag: 6.2.11
      title: >-
        Educators model effective speaking and listening behaviours and provide
        structured opportunities for discussion, cooperative learning, and
        evidence-based conversations.
      compass: false
      categories: []
    - tag: 6.2.12
      title: >-
        Educators model planning, drafting, revising, and editing processes, and
        learners use writing tools and organizational supports to communicate
        understanding.
      compass: false
      categories: []
    - tag: 6.2.13
      title: >-
        Educators use formative assessment and provide feedback to support
        learner growth in reading, writing, speaking, and listening.
      compass: false
      categories: []
    - tag: 6.2.14
      title: >-
        Learners begin applying literacy routines and strategies with guidance
        and support across learning areas.
      compass: false
      categories: []
developing:
  considerations:
    - tag: 6.2.15
      title: >-
        Learners independently use comprehension strategies to monitor
        understanding, make connections, determine importance, summarize, and
        construct meaning from increasingly complex texts.
      compass: false
      categories: []
    - tag: 6.2.16
      title: >-
        Learners use vocabulary knowledge, context clues, word study, and prior
        knowledge to support comprehension and communicate understanding.
      compass: false
      categories: []
    - tag: 6.2.17
      title: >-
        Learners independently select and use strategies and tools to organize
        information, monitor comprehension, and support learning.
      compass: true
      categories: []
    - tag: 6.2.18
      title: >-
        Learners participate in collaborative discussions, inquiry, peer
        tutoring, and feedback processes where they ask questions, use evidence,
        consider multiple perspectives, and build on others' thinking.
      compass: false
      categories: []
    - tag: 6.2.19
      title: >-
        Learners write for a variety of purposes and audiences, using feedback
        and self-assessment to improve clarity, organization, and communication.
      compass: false
      categories: []
    - tag: 6.2.20
      title: >-
        Learners use self-assessment, peer feedback, success criteria, and
        reflection to identify strengths and next steps.
      compass: false
      categories: []
    - tag: 6.2.21
      title: >-
        Learners increasingly take ownership of literacy practices and apply
        strategies independently in different contexts.
      compass: false
      categories: []
sustaining:
  considerations:
    - tag: 6.2.16
      title: >-
        Self-questioning and metacognitive strategies are routine, allowing
        learners to read and write to learn about self, world, and others (e.g.,
        learners annotate texts independently, making inferences and drawing
        personal connections without educator prompts).
      compass: false
      categories: []
    - tag: 6.2.17
      title: >-
        Scaffolding is dynamic, with learners adjusting their own supports as
        needed (e.g., some learners choose audiobooks, annotation tools, or
        graphic organizers that best support their comprehension needs.)
      compass: false
      categories: []
    - tag: 6.2.18
      title: >-
        Class discussions are fully learner-led, with deeper textual analysis
        supporting questioning and analyzing situations (e.g., in a
        learner-moderated debate, participants cite multiple texts as evidence
        for their arguments and challenge opposing perspectives constructively).
      compass: false
      categories: []
    - tag: 6.2.19
      title: >-
        Formal discussions (e.g., structured debates, peer-led literature
        circles) replace educator-led questioning (e.g., learners explore
        multiple representations by analyzing a novel, documentary, and opinion
        article on the same topic, comparing perspectives).
      compass: false
      categories: []
    - tag: 6.2.20
      title: >-
        Formative assessment is fully integrated, with learners self-regulating
        their learning and demonstrating knowledge by writing for a variety of
        purposes (e.g., learners track their growth over time using a reading
        and writing portfolio, setting personalized literacy goals based on
        feedback from peers and educators).
      compass: false
      categories: []
