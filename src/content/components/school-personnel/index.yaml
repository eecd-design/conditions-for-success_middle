indicator: identities
tag: '5.1'
title: School Personnel
initiating:
  considerations:
    - tag: 5.1.1
      title: >-
        School leadership begins conversations about the significance of staff
        members’ cultural, linguistic, and personal identities.
      compass: false
      categories: []
    - tag: 5.1.2
      title: >-
        Staff are encouraged to reflect individually on how their own
        backgrounds influence their teaching and interactions.
      compass: false
      categories: []
    - tag: 5.1.3
      title: >-
        Staff begin to recognize how varied identities and perspectives can
        strengthen school culture and learner experiences.
      compass: false
      categories: []
implementing:
  considerations:
    - tag: 5.1.4
      title: >-
        The school offers sessions or trainings on identity-related topics (such
        as implicit bias, equity, multicultural education).
      compass: false
      categories: []
    - tag: 5.1.5
      title: >-
        Staff develop a shared vocabulary around identity, culture, and
        inclusion, fostering a safe space for dialogue.
      compass: false
      categories: []
    - tag: 5.1.6
      title: >-
        Reflection on staff identities is more comprehensive, connecting
        personal identity to instructional approaches, curriculum choices, and
        learner outcomes.
      compass: true
      categories: []
developing:
  considerations:
    - tag: 5.1.7
      title: >-
        Regular, embedded learning opportunities encourage staff to explore
        intersectionality, cultural humility, and anti-bias practices.
      compass: false
      categories: []
    - tag: 5.1.8
      title: >-
        Reflection on staff identities is more comprehensive, connecting
        personal identity to instructional approaches, curriculum choices, and
        learner outcomes.
      compass: false
      categories: []
    - tag: 5.1.9
      title: >-
        School practices, rituals, traditions, and decision-making increasingly
        reflect varied staff identities, with leaders seeking a wide range of
        staff perspectives.
      compass: false
      categories: []
sustaining:
  considerations:
    - tag: 5.1.10
      title: >-
        The school’s policies, structures, and leadership behaviours
        consistently promote an environment where all staff identities are
        recognized, valued, and used as a resource for growth.
      compass: false
      categories: []
    - tag: 5.1.11
      title: >-
        Staff members lead ongoing dialogue and professional learning related to
        diversity, equity, and inclusion, reflecting a collective commitment to
        honouring staff identities.
      compass: false
      categories: []
    - tag: 5.1.12
      title: >-
        Partnerships with families and community members are strengthened by
        staff who bring cultural and linguistic assets into those relationships.
      compass: false
      categories: []
