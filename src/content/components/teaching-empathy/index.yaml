indicator: empathy
tag: '4.2'
title: Teaching Empathy
explainerResource: teaching-empathy-building-stronger-connections
initiating:
  considerations:
    - tag: 4.2.1
      title: >-
        Staff can describe each of the SEL outcomes (i.e., self-awareness,
        self-management, social awareness, relationship skills, making
        responsible decisions).
      compass: false
      categories: []
    - tag: 4.2.2
      title: >-
        Staff begin to recognize how empathy can be modelled and intentionally
        taught through every day interactions.
      compass: false
      categories: []
implementing:
  considerations:
    - tag: 4.2.3
      title: >-
        Leadership intentionally models empathy by recognizing staff efforts and
        perspectives and responding to staff needs with care and appropriate
        support.
      compass: false
      categories: []
    - tag: 4.2.4
      title: >-
        Staff look for intentional opportunities in the prescribed curriculum to
        teach empathy.
      compass: false
      categories: []
developing:
  considerations:
    - tag: 4.2.5
      title: >-
        Staff embed best practices (e.g., restorative circles) that help
        learners understand multiple perspectives, solve problems, and respond
        with empathy.
      compass: false
      categories: []
    - tag: 4.2.6
      title: >-
        Peer support groups or mentorships are established to foster mutual
        care, connection, and empathy among learners and staff.
      compass: false
      categories: []
sustaining:
  considerations:
    - tag: 4.2.7
      title: >-
        Empathy is consistently demonstrated in staff interactions,
        instructional practices, and decision-making.
      compass: false
      categories: []
    - tag: 4.2.8
      title: >-
        School culture emphasizes teaching learners to develop empathy, care for
        themselves, and contribute to the well-being of others.
      compass: false
      categories: []
