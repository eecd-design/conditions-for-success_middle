indicator: leadership-and-teaming
tag: '1.4'
title: Education Support Services Team Collaboration
initiating:
  considerations:
    - tag: 1.4.1
      title: >-
        Initial meetings are held with minimal structure, primarily addressing
        immediate learner needs.
      compass: false
      categories: []
    - tag: 1.4.2
      title: >-
        Meetings are primarily focused on individual situations, with data being
        used infrequently to inform discussion and planning.
      compass: false
      categories: []
    - tag: 1.4.3
      title: >-
        A method has been established that allows for learner input on key
        issues.
      compass: false
      categories: []
implementing:
  considerations:
    - tag: 1.4.4
      title: >-
        Meetings are biweekly, with structured agendas focused on academic and
        behavioural needs.
      compass: true
      categories: []
    - tag: 1.4.5
      title: Data is used to discuss trends and patterns in learner performance.
      compass: false
      categories: []
    - tag: 1.4.6
      title: >-
        Educators participate in the ESS referral process, including pre- and
        post-communication.
      compass: false
      categories: []
developing:
  considerations:
    - tag: 1.4.7
      title: >-
        Educators participate in ESS-hosted Problem-Solving Meetings to
        collaboratively design and implement interventions and supports for
        learners' academic and/or behavioural needs.
      compass: false
      categories: []
    - tag: 1.4.8
      title: >-
        Data trends are used to collaboratively design and implement
        interventions.
      compass: true
      categories: []
    - tag: 1.4.9
      title: >-
        Educators engage in co-planning and co-teaching to address diverse
        learner needs and actively involve learners in designing supports
        intended to meet their needs.
      compass: true
      categories: []
sustaining:
  considerations:
    - tag: 1.4.10
      title: >-
        Meetings are solution-focused, driven by learner-centered data, and
        aligned with the school’s vision.
      compass: true
      categories: []
    - tag: 1.4.11
      title: >-
        Continuous evaluation of interventions and progress monitoring ensures
        dynamic and effective support for learners.
      compass: true
      categories: []
    - tag: 1.4.12
      title: >-
        Educators and support teams work interdependently with learners to
        refine supports, with learners actively contributing to decisions that
        support their success.
      compass: false
      categories: []
