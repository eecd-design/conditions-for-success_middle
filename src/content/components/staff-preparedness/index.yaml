indicator: empathy
tag: '4.1'
title: Staff Preparedness
explainerResource: why-empathy-matters-supporting-learners
initiating:
  considerations:
    - tag: 4.1.1
      title: Staff appreciate and value diversity, equity, and inclusion.
      compass: false
      categories: []
    - tag: 4.1.2
      title: >-
        Leadership introduces the importance of empathy and creates
        opportunities for staff to discuss its role in their interactions and
        practice.
      compass: false
      categories: []
    - tag: 4.1.3
      title: >-
        Staff build self-awareness and recognize how adverse childhood
        experiences can impact learners and the classroom environment.
      compass: false
      categories: []
implementing:
  considerations:
    - tag: 4.1.4
      title: >-
        Staff participate in basic training on active listening, emotional
        awareness, finding common ground, negotiation, conflict resolution,
        supportive communication, and addressing discrimination.
      compass: false
      categories: []
    - tag: 4.1.5
      title: Staff can identify examples of implicit bias.
      compass: false
      categories: []
    - tag: 4.1.6
      title: >-
        All staff are trauma-informed* and know how to provide positive
        childhood experiences to support any potential adverse childhood
        experiences.


        *Being trauma aware and responding with supportive strategies. For
        example, an educator notices a learner in distress and offers supports
        such as sensory tools and choice.
      compass: false
      categories: []
developing:
  considerations:
    - tag: 4.1.7
      title: >-
        Leadership and staff regularly check in on learners' well-being and use
        what they learn to inform their interactions and support, while also
        creating opportunities for collegial check-ins.
      compass: false
      categories: []
    - tag: 4.1.8
      title: >-
        Staff incorporate strategies and structures in each classroom to support
        the social-emotional development of all learners.
      compass: false
      categories: []
    - tag: 4.1.9
      title: >-
        All staff are trauma-assumed*. Staff understand that many learners may
        be affected by adverse childhood experiences and provide positive
        childhood experiences for all learners.


        *A mindset in which we proactively assume that the people we interact
        with may have experienced trauma and thus we design our environments and
        practices accordingly (UDL). For example, an educator sets up the
        learning environment with a variety of spaces, choice, and calming
        activities.
      compass: false
      categories: []
sustaining:
  considerations:
    - tag: 4.1.10
      title: >-
        Staff consistently use evidence-based practices and ongoing check-ins to
        ensure all learners feel seen, heard, and valued, while fostering a
        supportive and connected staff culture.
      compass: true
      categories: []
    - tag: 4.1.11
      title: >-
        Staff survey data shows a strong sense of emotional safety and support
        within the school.
      compass: false
      categories: []
    - tag: 4.1.12
      title: >-
        All staff are trauma-invested* and consistently evaluate their practices
        to create positive childhood experiences for all learners.


        *Staff act collectively on their understanding of trauma to ensure
        safety, consistency, and care for all learners. For example,
        whole-school approaches like PBIS that address the needs of the whole
        child.
      compass: false
      categories: []
