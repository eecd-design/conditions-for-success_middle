indicator: identities
tag: '5.2'
title: Learners
initiating:
  considerations:
    - tag: 5.2.1
      title: >-
        Staff acknowledge the importance of learners’ identities in shaping
        their learning experiences.
      compass: false
      categories: []
    - tag: 5.2.2
      title: >-
        Conversations around learners’ identities are beginning but are
        inconsistent across classrooms.
      compass: false
      categories: []
    - tag: 5.2.3
      title: >-
        Learners have limited opportunities to express their identities in
        school.
      compass: false
      categories: []
    - tag: 5.2.4
      title: >-
        Schools identify advocates and supports that affirm a range of learner
        identities (e.g., 2SLGBTQIA+, Indigenous, etc.).
      compass: false
      categories: []
implementing:
  considerations:
    - tag: 5.2.5
      title: >-
        Educators begin incorporating learners’ identities into daily
        instruction and classroom activities.
      compass: false
      categories: []
    - tag: 5.2.6
      title: >-
        Learners' identities are increasingly reflected in school- and
        community-connected activities such as guest speakers, cultural groups,
        and identity-focused events.
      compass: false
      categories: []
    - tag: 5.2.7
      title: >-
        SEL practices (i.e., self-awareness, self-management, social awareness,
        relationship skills, responsible decision-making) are connected to
        learners' personal, developmental, and cultural backgrounds.
      compass: false
      categories: []
    - tag: 5.2.8
      title: >-
        School provides social opportunities for learners to explore their
        identities through clubs, discussions, projects, and other activities
        such as Global Minds, cultural clubs, and GSA.
      compass: false
      categories: []
developing:
  considerations:
    - tag: 5.2.9
      title: >-
        Classroom and school-wide activities regularly acknowledge and affirm
        learners’ identities through enacted curriculum choices, hosted events,
        and community connections.
      compass: false
      categories: []
    - tag: 5.2.10
      title: >-
        Educators consistently incorporate culturally responsive SEL practices
        and intercultural competence into their teaching.
      compass: false
      categories: []
    - tag: 5.2.11
      title: >-
        Learners regularly share and explore their identities through structured
        activities, such as presentations, group discussions, projects, and/or
        school initiatives.
      compass: false
      categories: []
sustaining:
  considerations:
    - tag: 5.2.12
      title: >-
        School culture consistently affirms and values diverse learner
        identities, with regular events, celebrations, and curriculum that
        reflects these identities.
      compass: false
      categories: []
    - tag: 5.2.13
      title: >-
        Staff consistently use a range of SEL practices to ensure that
        self-awareness, self-management, social awareness, and other key SEL
        outcomes are grounded in learners’ unique developmental and cultural
        contexts.
      compass: false
      categories: []
    - tag: 5.2.14
      title: >-
        Learners take an active role in sharing and exploring identities, with
        leadership opportunities (e.g., clubs, panels, peer mentorship) that
        allow for self-expression and community involvement.
      compass: false
      categories: []
    - tag: 5.2.15
      title: >-
        Learner voice and leadership consistently shape school practices,
        decisions, and initiatives related to identity, belonging, and
        inclusion.
      compass: false
      categories: []
